version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: atelier_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atelier_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      # For local Docker use — production uses MongoDB Atlas
      - MONGO_URL=mongodb://admin:adminpassword@mongodb:27017/?authSource=admin
      - DB_NAME=${DB_NAME:-Atlier}
      - API_KEY=${API_KEY}
      # OpenAI API key (previously EMERGENT_LLM_KEY — same value, new name)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - SENDER_EMAIL=${SENDER_EMAIL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN:-}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:-primary}
    depends_on:
      - mongodb

volumes:
  mongo_data:
